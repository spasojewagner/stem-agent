# docker compose run --rm stem selftest
# docker compose run --rm stem grow --env archive
services:
  stem:
    build: .
    env_file: .env              # the key reaches the container as an env var, not a file
    volumes:
      - ./runs:/app/runs        # genomes, logs and results stay on your disk
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    pids_limit: 256
